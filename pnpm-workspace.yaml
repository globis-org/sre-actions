engineStrict: true
minimumReleaseAge: 10080 # 1 week
minimumReleaseAgeExclude:
  - typescript
  - '@typescript/*'
  # Renovate security update: minimatch@11.0.1
  - minimatch@11.0.1

packages:
  - '*'

savePrefix: ''

# preinstall/install/postinstall スクリプトの実行を許可するかどうか
# デフォルトは false
allowBuilds:
  esbuild: true
