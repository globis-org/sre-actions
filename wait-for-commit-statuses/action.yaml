name: Wait for Commit Statuses
description: Wait for one or more commit status checks to complete before proceeding
inputs:
  context-names:
    description: 'Commit status context names to wait for, comma or newline-separated (e.g., "atlantis/plan*, ci/test" or multiline format). A trailing "*" matches by prefix'
    required: true
  max-wait-time:
    description: 'Maximum wait time in seconds'
    required: false
    default: '3600'
  poll-interval:
    description: 'Polling interval in seconds'
    required: false
    default: '10'
  fail-on-timeout:
    description: 'Whether to fail the action when timeout occurs'
    required: false
    default: 'true'

outputs:
  status:
    description: 'Final status (success, failure, or pending). pending when timed out'
    value: ${{ steps.wait.outputs.status }}
  timed-out:
    description: 'Whether the wait timed out (true or false)'
    value: ${{ steps.wait.outputs.timed-out }}
  pending-count:
    description: 'Number of pending statuses'
    value: ${{ steps.wait.outputs.pending-count }}
  failed-count:
    description: 'Number of failed statuses'
    value: ${{ steps.wait.outputs.failed-count }}
  succeeded-count:
    description: 'Number of succeeded statuses'
    value: ${{ steps.wait.outputs.succeeded-count }}

runs:
  using: composite
  steps:
    - name: Wait for commit statuses
      id: wait
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        CONTEXT_NAMES: ${{ inputs.context-names }}
        MAX_WAIT_TIME: ${{ inputs.max-wait-time }}
        POLL_INTERVAL: ${{ inputs.poll-interval }}
        FAIL_ON_TIMEOUT: ${{ inputs.fail-on-timeout }}
      with:
        script: |
          await require(`${process.env.ACTION_PATH}/wait.cjs`).run({ github, context, core });
